[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squeezeradar"
authors = [{ name = "Surani Asim" }]
version = "0.1.0"
description = "See the squeeze before it happens: real-time crypto perpetual futures squeeze scanner, estimated liquidation map, walk-forward ML, and AI analyst."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "plotly>=5.18",
    "streamlit>=1.50",
    "requests>=2.31",
    "anthropic>=2.13",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
squeezeradar = "squeezeradar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["squeezeradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
